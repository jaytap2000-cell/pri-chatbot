=== COLLEGE CAMPS — JASON'S FULL FRAMEWORK ===
This is one of the most common and important topics. Use this knowledge when anyone asks about camps, camp invites, which camp to attend, or whether a camp is worth it.

**The Core Framework: Camp is Risk vs. Reward**
Almost every athlete will need to attend at least one college camp to get recruited. Getting directly in front of college coaches — in their gym, with their players — is a critical part of the process. But camp decisions require real evaluation. You can spend a lot of money, time, and energy going to camps and get nothing from it. You can also make one smart camp choice and unlock a huge opportunity.

**The Two Big Questions Families Always Ask**

1. "Is this camp worth it?"
Real talk: I can't answer that without context. Worth it depends on what you're trying to get out of it — training? Campus experience? Recruiting? Those are three different things. From a recruiting standpoint, if you can't realistically play at that school's level, you don't need to go to that camp just because it sounds impressive. The decision has to factor in: time, money, energy, logistics, what you're missing to go (church camp, tryouts, family stuff), and what the realistic reward is.

2. "Is this just a money grab?"
Almost every college camp — third party or on-campus — exists to generate revenue. That's just true. But that doesn't automatically make it a money grab FOR YOU. If you do the proper evaluation first, the camp can absolutely be worth it. If you don't, and you attend a camp where nothing lines up for your daughter, then yeah — it probably felt like a money grab. The camp invite itself means nothing. Coaches send thousands of invites to athletes they are not recruiting.

**4 Questions to Ask BEFORE Going to Any Camp**

1. **Are they recruiting my position?** If a school isn't looking for a setter in your class, going to their camp as a setter is risky. This matters most for juniors and seniors. Freshmen have a little more flexibility here since needs lists change.

2. **Are they interested in you?** A camp invite is NOT a sign of interest. Coaches send mass invites by height or general prospect lists to athletes they have zero intention of recruiting. You need some separate signal of interest — a personal email, a follow-up after seeing your film, a coach reaching out to your club coach. That's what moves a camp from "maybe" to "yes."

3. **Are these schools you're actually interested in?** Especially for third-party and club-run camps with multiple coaches present — are the schools attending camps you'd actually want to go to? If it's 25 Power 5 schools and your daughter can't realistically play at that level, the camp may be a great experience but a poor recruiting move. Match the schools at the camp to your realistic target list.

4. **Do they know who you are?** Have you been emailing this coaching staff? Have you sent film? When you walk in and give your name at check-in, should they already know it? This is huge. When Jason was coaching college, he'd send his players out to the parking lot to meet the recruits he actually wanted — before they even walked in the building. If a coach has never heard of your daughter, she's starting from zero at that camp among 50+ athletes.

**The 3 Types of Camps**

**Type 1: Club/Third-Party Coaching Camps**
A club brings in 5, 10, 25 college coaches for a day or weekend event. These can be great or you can get completely lost. Key things to know:
- College coaches at these camps are usually nice and engaging with everyone — that's their job. A coach laughing with your daughter and giving her feedback does NOT mean they're recruiting her.
- If a coach is genuinely interested after seeing an athlete at one of these camps, they will pursue it — they'll seek out the athlete directly, ask for contact info, or reach out to the club coordinator.
- These camps can be great when the schools attending match your target list. Example: if three D2 schools you're already interested in are all at one camp, that's efficient and smart.

**Type 2: Third-Party Showcases (EXACT Sports, Junior Day camps, etc.)**
These are run by businesses, not schools. They exist to make money — and that's fine, they do provide value. College coaches working these camps are often making extra money on the side. Grad assistants sometimes attend in place of head or associate coaches. Key things to know:
- These can work really well for athletes trying to get in front of coaches in a specific region. Example: an athlete who wants to play in the Northeast can fly up to a Pennsylvania camp and get in front of 10 Northeast coaches at once.
- Don't go expecting an offer. Go expecting exposure, interaction, and maybe planting a seed.
- Ask who specifically will be there — a head coach vs. a grad assistant is a very different situation.

**Type 3: On-Campus College Camps**
These are the most important and hardest to avoid. Going to a school's own campus camp is almost always required to get recruited there. Why? Coaches want to:
- See you compete in their gym
- Watch how you interact with their current college players
- Get feedback from their team about culture fit
- Evaluate you one-on-one in a controlled environment

You don't have to attend for all days if it's a multi-day camp. Most college coaches understand the reality of athletes bouncing between camps. A coach who tells you "don't come unless you can stay all three days" is being unreasonable — that's not a great sign.

**The Risk of NOT Going**
If you choose not to attend a camp at a school you're serious about, understand: other athletes ARE going. And coaches may fill their needs list from the athletes who showed up. The risk runs both ways — there's risk in going AND risk in not going.

**Camp Names Don't Mean Much**
"ID Camp," "Showcase Camp," "College Experience Camp" — coaches themselves have said the descriptions are often identical; they just have different names. Don't stress about which specific camp format is "best." Focus on: is this school a fit, do they know who I am, and will the right coaches actually be there?

**Bottom Line on Camps**
There's no universal answer. Every family's situation is different — finances, location, timing, class year, target schools, and current interest level from coaches all factor in. The best camp decision is one you've thought through, not one you made because you got an invite in your inbox. Work through it with your recruiting coordinator (or Jason directly) before committing money and time.

**Camp Invites: What They Actually Mean (and What They Don't)**
Use this when a family says "we got a camp invite" or asks whether an invite means a school is interested.
- A camp invite may or may not mean interest. Lots of programs send lots of invites, and many coaches have gotten very good at making mass emails look personal (using the athlete's name, adding a personal line). Families often say "this one was a personal invite," and sometimes the exact same email went to many athletes.
- Getting a camp invite is not a flex. Jason says he could get almost any of his 1-on-1 athletes invites to schools like Baylor, Florida, TCU, Texas Tech, Rice, and SMU. Getting the invite isn't the hard part. Being a top two or three athlete on a school's list is the hard part.
- It is still exciting and it does mean someone noticed you somewhere. It just isn't enough information on its own to decide where to spend your summer.
- The real signals of interest: How much time are coaches spending at your court? Are they talking to your club coach, club director, or recruiting coordinator about you? What does the back-and-forth communication look like? Once contact is allowed, coaches call and text the athletes they want most. They don't just send them a camp invite.
- Most schools recruit only three or four athletes out of the 40, 50, 60, or even 100 athletes who come through their camps. Where are you on that list?
- Why it matters: if you choose School A's camp because of an invite and miss School B's camp, and School B was actually more interested, School B may recruit someone else. Know the level of interest BEFORE you choose camps.
- Camp is still essential. You must go to camp. The point is to go to camps at schools that are actually recruiting you.

=== HOW HARD IS IT TO PLAY COLLEGE VOLLEYBALL? ===
Use this when families ask about how competitive college volleyball is, whether their daughter has a realistic shot, what level to target, or how to frame the difficulty of the process.

**The Mega-District Analogy (Jason's Framework)**
Here's a way to think about it: imagine your city combined all 8 high schools into one massive mega-school. There would still be JV teams, but only ONE varsity team of 17 athletes. Would your daughter still make varsity at that mega-school? That's essentially what happens when athletes move from high school to college volleyball.

**The Numbers**
- A typical district has ~8 teams × 17 athletes = 136 varsity players
- Only 17 of those 136 make the mega-school varsity team
- That's **12.5% of high school varsity players** who could make the cut at the district level

**Playing time is even harder:**
- Only about 40% of any college roster plays in half the team's sets
- That means roughly 60% of a college roster is barely playing, if at all
- So only ~10 of those 17 roster spots are actually seeing real court time
- 10 out of 136 = **about 7%** — and that's just at the district level

**The Real Scale: High School to D1**
What's actually happening in the jump from high school to college is more like taking 80 high schools and making one team:
- 80 high schools × 17 athletes = 1,360 varsity players
- Only 17 make a D1 roster
- That's **1.2% of high school volleyball players** playing at the Division 1 level — not on scholarship, just playing

**What This Means for Families**
This isn't meant to discourage anyone — it's meant to set realistic expectations and motivate real preparation. A few key takeaways:
- This is why level fit matters so much. D1 isn't the only path — D2, D3, NAIA, and junior college are all legitimate places to play and compete.
- If your daughter really wants to play college volleyball, the work ethic has to start now. Getting to the college level is hard. Staying there and earning court time is even harder.
- The athletes who make it aren't just talented — they're the ones who outworked everyone else in the process.

=== JUNE 15TH & THE SPEED OF RECRUITING — WHAT FAMILIES NEED TO KNOW ===
Use this when families ask about June 15th, how fast recruiting moves, hard deadlines from coaches, when to commit, or what to expect when D1 coaches can first contact athletes.

**The Numbers Tell the Story**
Recruiting has gotten dramatically faster in recent years:
- 2023: ~100 athletes committed between June 15th and August 1st
- 2024: ~250 athletes committed in that same six-week window
- 2025 (Class of 2027): 200 commitments in the FIRST WEEK. By July 3rd — not even six weeks in — there were 330 commitments.

This isn't a fluke. Recruiting is speeding up and it's not slowing down.

**Why Is It Happening So Fast?**
Two big reasons:

1. **College coaches are living in the gray areas.** They've figured out workarounds and gray areas in the contact rules. More coaches than ever are comfortable bending or working around the spirit of those rules. When athletes are committing within 24 hours of June 15th, either coaches are very good at their jobs — or conversations were already happening. This is reality, not opinion.

2. **The transfer portal changed everything.** College coaches now view December and May transfer portal windows as a safety net. If they don't get the athlete they want, they can go to the portal. This has made them more aggressive in the immediate June 15th window — move fast, lock in who you want, and if something falls apart later, use the portal. Some programs have even stopped recruiting certain positions out of high school entirely, planning to just pull transfer portal athletes instead.

**Hard Deadlines Are Now the Norm**
A year ago, if you asked 100 college coaches whether they gave 24-48 hour deadlines or offered multiple athletes and gave the scholarship to whoever said yes first — 85 would have said no. Today? 85-90 would say yes. Coaches who never used pressure tactics before are now using them because they were losing athletes to programs that did.

The psychology is real: the school that puts an athlete under a deadline typically gets the athlete, even when another school said "take all the time you need." It's been true for 17+ years.

**What This Means for 2029 and 2030 Athletes**
This trend is not just for Power 5 athletes. Mid-major D1 schools and D2 programs are also giving hard deadlines and getting commitments in that first week. Every level is moving faster.

Key things to understand:
- Fewer athletes are going on official visits before committing — many are making decisions before they're even eligible to take a visit
- If a school puts you under a 24-48 hour deadline, that's normal now — not a red flag
- You need to already have a strong sense of schools you're interested in BEFORE June 15th so you're not making a huge decision blind
- The athletes who are prepared are the ones who started early — emailing coaches, visiting campuses on their own, going to camps, building relationships

**The Proactive Message**
Start now. Not when your class becomes the focus. Not when coaches start calling. Now. Email coaches. Visit campuses independently. Go to camps. Interact with coaches whenever and wherever it's allowed. The more work you do before June 15th, the more prepared you'll be when everything speeds up and decisions have to be made fast.

**Jason's Take**
He's not bashing coaches for moving fast or athletes for committing early — that's just the reality. His job is to make sure families aren't caught off guard when a coach calls on June 15th with a 48-hour deadline and they've never even seen the campus.

=== HIGHLIGHT FILM — WHAT IT REALLY NEEDS TO DO ===
Use this when families ask about highlight videos, how long they should be, what to include, whether their film is good enough, or why coaches aren't responding to it.

**The Only Question That Actually Matters**
There are a lot of opinions out there about highlight film — volleyball dad Facebook groups are full of them. Here's the truth: the only question that matters when a college coach sits down to watch your film is:

**"Can she help me win?"**

If your highlight video communicates yes to that question, it did its job. That's it. Everything else — length, format, whether you have arrows and circles, the music — is preference and guidelines, not rules. Some coaches like it one way, some another. There's a lot of variance. Jason has preferences, but he won't pretend there's one right answer for everything.

**Jason's General Guidelines (Not Rules)**
- Length: roughly 1.5 to 2.5 minutes depending on how much film you have. A video that's 2:31 isn't broken. Don't cut good footage just to hit an arbitrary number.
- Avoid auto-generated highlights from Hudl — coaches generally don't like them and they don't showcase you well
- Don't include things coaches don't care about or that don't show your athleticism
- No pause-and-circle stuff — Jason's not a fan, though it won't sink you if the volleyball is good

**What Your Highlight Film Should Actually Do**
Your film should get a response. That response might look like:
- A coach marking you in their recruiting system
- Showing up at your court at a qualifier
- Clicking to watch more film
- Emailing your club coach or recruiting coordinator asking about you

If you're getting those responses — your film is working. Don't overthink it.

**If You're NOT Getting a Response — Two Possibilities**

1. **Your highlight video isn't showcasing you well enough.** You might be a good fit for the program, but the film doesn't communicate that. You're not highlighting your athleticism, or you're including stuff coaches don't want to see. Fix the film.

2. **You're emailing the wrong schools.** The coach is watching your film and answering "no, she can't help me win" — and moving on. This isn't about the film quality, it's about the fit. You need a new list of schools at the right level for you.

If you try fixing the film and you're still getting no responses — it's probably option 2. Time to adjust the school list, not keep tweaking the video.

**The Bottom Line**
Stop stressing about every detail of the highlight film and focus on what it communicates. Does it show a coach that this athlete can help their program win? If yes, send it. If you're not getting responses, figure out which of the two problems you're dealing with — and fix that one.

**YouTube Video:** Jason breaks this down in full at https://youtu.be/Cicj-eAp8-c

Also mention: PRI has email templates and resources at privolleyball.com that can help athletes reach out to coaches the right way alongside their film.

=== EMAILING COACHES — SOCIAL MEDIA IS NOT A REPLACEMENT ===
Use this when families ask about how to get coaches to notice them, whether posting on Instagram is enough, how to reach out to coaches, or why coaches aren't coming to watch their daughter.

**The Controversial Truth**
Posting your tournament schedule on Instagram is not going to get college coaches to come watch you. It's not a replacement for emailing coaches directly. There is no replacement for the email.

Why doesn't a social media post work?
- It doesn't show interest in THEM specifically
- It's not directed at any coach or program
- Coaches aren't scrolling your Instagram looking for recruits

Jason heard this directly from P5 assistant coaches at a qualifier in Houston:
- "We usually spend most of our time evaluating the athletes that reach out to us directly."
- "I don't think these athletes understand that we would be more interested in them if they just reached out to us."

One email. That's all it takes to start. But Jason wants athletes sending more than one — he wants them emailing coaches throughout the entire club season.

**When to Email — Not Just These Two Moments**
Most athletes only email coaches:
- When they have new film
- The day before a qualifier

That's not enough. Coaches need to get to know you over time. They need to have you in the back of their mind when they're watching other athletes at a qualifier you're not even at. Recruiting is a competition.

**What You're Competing On**
Through consistent outreach, you're showing coaches:
- Why you're a better athlete
- Why they should pick you over someone else
- That you have better leadership
- That you are MORE interested in their program
- That you're a better teammate

You can't communicate all of that in one email the night before a tournament. You need time to tell your story.

**The Interest Goes Both Ways**
College coaches pursue athletes who are ALSO interested in them. If you haven't told a coach why you're interested in their school specifically — their program, their academics, their location, their culture — you're leaving a huge piece on the table. That takes more than one email. And you can't do it standing on a court at a qualifier.

**How Do You Get Coaches to Your Court?**
You tell them to come watch you — directly, personally, via email. Your Instagram schedule doesn't tell them to come. Your email does. And that email should explain who you are, why you'd help their program win, and why their school matters to you.

**The Bottom Line**
Post on social media if you want. There's nothing wrong with it. But do not let it replace your email outreach. The athletes getting recruited are the ones in coaches' inboxes — consistently, personally, and throughout the entire season.

=== RECRUITING TIMELINE — EVERY SCHOOL IS ON A DIFFERENT CLOCK ===
Use this when families ask about timing, when to start reaching out, whether it's too early, or how to prioritize which schools to contact first.

**The Big Idea**
Everyone talks about the "recruiting timeline" as if it's one thing. It's not. Yes, there's a big-picture timeline for the process overall — but every individual school is on its own slightly different timeline. This is one of the most misunderstood parts of recruiting.

**What's Actually Happening Right Now at D1 and D2 Programs (Class of 2028 Example)**
Jason talked to multiple D1 and D2 coaches at a qualifier and here's the range of where programs actually are:

1. **Hyper-focused** — evaluating their top 5-10 athletes in the 2028 class so they know exactly who to offer on June 15th
2. **List-building** — generating their camp invite list of 2028 athletes they want to see this summer
3. **Just getting started** — only now beginning to evaluate 2028 athletes seriously
4. **Still finishing 2027** — haven't really turned attention to 2028 yet; might not until fall

Every one of these schools exists RIGHT NOW in the same recruiting cycle. That's the reality.

**The Mistake Families Make**
A lot of families think: "We'll focus on Power 5 schools first, then work our way down to lower levels later." That logic sounds reasonable — but it's wrong.

Here's why: you don't know which timeline a school is on. Some D2 schools have already been watching, evaluating, and even having phone calls with 2028 athletes. If you wait until right before Nationals to reach out to D2 schools, some of them may have already moved on. They've been building their list all spring. If you're not on it, they're focused on athletes who are.

**The Right Approach**
- Reach out to ALL schools on your list — not just the top ones
- Reach out to schools at ALL levels simultaneously — D1, D2, D3, NAIA
- Start the minute you begin your recruiting process — don't wait for schools to "be ready" for your class
- It may take time for some schools to start recruiting your class, but if you're on their radar early, you stay on their list. If you're not, they focus on other athletes.

**The Evaluation Window Is Limited**
Once qualifier season starts, your opportunities to get evaluated by coaches in person shrink fast. You can't count on being seen at every tournament — you don't know which schools are using which events to evaluate which classes. The Lonestar Classic, the SLC Showdown, any qualifier — coaches may or may not be there watching your class. Don't assume. Be proactive with outreach so coaches are already aware of you before they even show up to watch.

**Bottom Line**
Don't try to time the market. Don't wait for the "right moment" to reach out to certain schools. The shifts from one stage to the next happen quickly and you won't see them coming. The families who stay ahead are the ones who are consistently reaching out across all levels from day one.

More on evaluation windows: https://www.privolleyball.com/post/recruiting-thoughts-from-red-rock-rave

=== THE FIFTH-YEAR LEGISLATION — HOW IT'S QUIETLY RESHAPING ROSTER SPOTS ===
Use this when families ask about the fifth-year eligibility rule, why roster spots feel tighter this year, why coaches seem hesitant to offer, why recruiting feels slower or more unpredictable for the 2027-2029 classes, or anything about the transfer portal's effect on high school recruiting.

**What Just Happened**
Division I has passed legislation giving athletes an extra year of eligibility (a "fifth year"). Jason has spent this year's Nationals talking with college coaches, and this single topic has dominated almost every conversation. It's affecting the 2027 class already, but its biggest impact right now is on the 2028 class.

**Reason 1: Coaches Are Now Choosing NOT to Fill Some Roster Spots**
Last year, Jason was already warning the 2028 class that a lot of schools planned to offer or call only their top one or two recruiting targets on June 15th, then lean on the transfer portal for the rest. That trend has gotten dramatically stronger this year. It's no longer just "if we miss our top targets, we'll go to the portal" — many coaches are now saying they don't need to fill a position at all, because a returning fifth-year athlete (or a younger athlete already on the roster) can cover that spot for another year. Fewer total roster spots are opening up, and coaches are actively choosing to leave some unfilled rather than recruit a true freshman.

Jason has seen this play out with athletes who were heavily recruited and who coaching staffs fully intended to offer on June 15th — until those staffs ran the numbers on what their roster looked like with fifth-year seniors staying, and pulled back because they simply didn't need the position anymore.

**Reason 2: The Math Is Bigger Than People Realize**
Every college coach Jason has talked to — at both the D1 and D2 level — expects Division II to pass its own fifth-year legislation soon (D2 reportedly held off earlier just to avoid being the first conference sued over it, not because they disagree with it). Once D2 falls in line with D1, you're looking at roughly 500-600 fewer roster spots per year, nationally, across D1 and D2 combined, that would otherwise have gone to incoming high school recruits. That's a structural shift, not a one-year blip.

**Reason 3: Commitments May Start Coming Later — and More Unpredictably**
Jason's read on where this is heading (he's open to being wrong): a lot of the athletes who are granted a fifth year won't actually use it. Maybe half. Maybe as low as a third — it depends heavily on the individual and the program. The problem is that decision often gets made later than coaches would like. An athlete who was expected to stay for a fifth year might change their mind, and suddenly a coaching staff has an open roster spot they didn't plan for — potentially with no transfer portal window left to fill it (the May transfer window may be going away too). In that scenario, coaches may go looking for a senior recruit later in the cycle than has been typical, specifically to fill that late-breaking vacancy.

**What This Means for Families Right Now**
- Roster math is tighter across the board — this isn't just a Power 5 story, it touches D1 and (soon) D2 broadly.
- Coaches sitting back and "waiting" longer than usual on offers isn't necessarily a sign of disinterest — it may reflect genuine uncertainty about their own roster.
- Commitments for some athletes, especially seniors, may end up happening later in the cycle than families expect, as coaches scramble to fill spots that open unexpectedly.
- This makes it even more important to stay engaged with schools at every level (D1, D2, D3, NAIA) rather than betting everything on one tier — see the RECRUITING TIMELINE section above.
- Expect continued rule changes across college volleyball over the next year or so as this cycle works itself out. This is an evolving situation, not a settled one.

**The Bottom Line**
This legislation is having a real, and right now mostly negative, impact on high school athletes trying to break into college volleyball, simply because there are fewer open spots. It's likely to keep affecting the process for a few more recruiting cycles until things settle into a new normal. Families should go in with clear eyes about this rather than be caught off guard by a slower or more unpredictable process than in past years.

=== VOLLEYBALL SHOULD STILL BE FUN — JASON'S PERSPECTIVE ===
Use this when families seem stressed or overwhelmed about recruiting, when parents are pushing too hard, when athletes seem burnt out, or when anyone asks about balancing the recruiting process with just being a kid.

**The Core Message**
The recruiting process is serious. The work is real. But volleyball should still be fun — and that never changes no matter how intense the process gets.

**The Story That Says It All**
Jason was at the SLC Showdown Qualifier and watched three teams of high-level athletes — some of the best in the country for their age group — playing sharks and minnows and duck duck goose while waiting for a wet court to dry. No nets, no jerseys, no intensity of competition. They were just kids having fun. And that's exactly what they should be.

Some of these athletes are barely teenagers. Jason had a recruiting meeting that same week with a family and realized mid-conversation that the athlete wasn't old enough to have her driver's permit yet.

**What Jason Believes**
Yes, high-level athletes need to:
- Train hard
- Have high expectations
- Compete with intensity
- Do extra workouts
- Improve their skills
- Get stronger
- Learn and grow from coaches

AND at the same time, they need to:
- Take breaks
- Play games with friends
- Go to prom
- Read a book
- Have conversations that have nothing to do with volleyball

You can take recruiting seriously AND still have fun. In fact, Jason believes coaches notice when an athlete has that balance — it's a sign of maturity and a healthy relationship with the sport.

**For Stressed-Out Parents**
The next 6 weeks of qualifier season and summer recruiting can feel relentless — zoom calls, phone calls, texts, emails, camp decisions, coach outreach. It doesn't stop. But none of that changes the fact that your daughter is still a kid first. Keep that in perspective. The process is a means to an end — the goal is for her to find a place where she loves the sport and thrives. That can't happen if the fun is gone before she even gets there.

=== SOCIAL MEDIA FOLLOWS — WHAT THEY ACTUALLY MEAN ===
Use this when families ask about a school following their daughter on social media, University Athlete follows, or whether social media activity signals real interest from coaches.

**The Short Answer**
A school following your athlete on social media might mean something. It might mean absolutely nothing. The follow itself tells you very little — what matters is how interested they are, not whether they clicked a button.

**Why Schools Follow Athletes on Social Media**
There are a lot of reasons a program might follow an athlete, and most of them aren't what families hope they mean:
- The athlete followed them first and they're just following back (a simple follow-for-follow)
- They want the athlete to follow them back
- They like the content the athlete posts — good volleyball content, highlight clips, etc.
- Someone who isn't even the coaching staff controls the account — GAs, SID interns, or social media managers who have no idea who they're recruiting

That last one is huge. Several programs have their social media run by someone who has zero connection to the recruiting process. A follow from that account tells you nothing about what the coaches think.

**Interest Is Relative — and That's the Key**
Even if the follow does signal some level of interest, the real question is: how interested? This is where families have to be honest.

College programs will send 100 handwritten camp invites to athletes they're "interested in." They'll mail 75 t-shirts to recruits on their list. But there's an enormous gap between the #1 recruit they're chasing and recruit #75 or #100. Many programs tier their recruits — top tier, second tier — and athletes in the second tier may rarely, if ever, hear from that school again.

A social media follow could put you anywhere on that spectrum, including so far down the list that the school never realistically recruits you.

**The Question to Always Ask**
If a school follows your athlete on social media but doesn't follow her around the convention center at a qualifier — there's your answer. Real interest shows up in person. Real interest means a coach is at her court, watching her play, tracking her down afterward.

A follow is easy. Showing up is intentional.

**University Athlete Follows**
University Athlete is slightly different from Instagram or Twitter/X — some coaches use it strategically and some don't even know you can follow athletes on it. A follow there has the same uncertainty as anywhere else: maybe it's intentional, maybe it isn't.

**What to Do With a Social Media Follow**
Don't ignore it — use it as an opening. If a school follows your athlete, that's a reason to send them an email. Acknowledge it, show genuine interest in their program, and attach film. Turn a passive signal into an active conversation. That's how you find out if the interest is real.

=== RANKING YOUR SCHOOLS — WHY JASON DISCOURAGES IT ===
Use this when families ask about how to prioritize their school list, whether they should rank schools, which schools to focus on first, or how to build and manage their target list.

**The Unpopular Opinion**
Don't rank your schools — at least not early in the process. This isn't about being disorganized. It's about not putting yourself in a mental box before you have the information you actually need to make that call.

**What Ranking Too Early Actually Does**
When athletes create a list and rank it before they've heard from coaches, visited campuses, or gotten real feedback, it creates a problem: they spend their mental energy asking "what about my #1?" instead of staying open to where real interest is developing. That "what about" mindset is genuinely detrimental to the process.

**The Biggest Missing Piece: Mutual Interest**
You can't rank schools before you know which schools are interested in YOU. Ranking assumes you'll have a choice between all of them — but that's not guaranteed. Most families create and rank a list before coaches have weighed in at all. That's backwards.

**The Real Story: A Top 10 That Disappeared**
Jason worked with an athlete whose top 10 list was locked in by late April, about six weeks before June 15th. When June 15th came, she ended up taking two visits and getting two offers — from schools that weren't on her list at all. Her "top 10" became irrelevant. This happens constantly.

**You Don't Know What You Don't Know**
A lot of athletes rank schools before they've:
- Been on campus visits
- Gone to camps and interacted with college coaches
- Talked to current players on those teams
- Experienced what different programs actually feel like

Perspectives change. A 14 or 15-year-old athlete who's certain she wants to go out of state might be saying "maybe I can stay close to home" a year later. An athlete who'd never heard of a school on May 31st might be telling Jason she wants to go there after spending 20 minutes with that coach at a camp on June 1st. That's not indecisiveness — that's the process working.

**The Reality: Very Few Athletes Are in a Position to Rank Early**
The only athletes who can legitimately rank schools early are the ones who could basically pick from their top two or three and expect offers from all of them. Those athletes don't even need a top 10 — they need one school. For everyone else — the other 98% — ranking early just sets up false expectations and wasted energy.

**What Happens When Your Ranked List Disappears**
If you've spent three months emailing only your top five or ten schools and none of them pan out, you're starting from zero. That's one of the worst positions to be in during recruiting. A small, ranked list that evaporates leaves you with no pipeline and no momentum.

**College Coaches Do This Too — And It Doesn't Work for Them Either**
When coaches talk about "second tier" recruits, Jason always asks: when was the last time you offered a scholarship to someone in your second tier? Long pause. They don't. Coaches fixate on the athletes they really want, and the tier system is mostly just a way of tracking names they're not really pursuing. Athletes shouldn't mirror that same false ranking structure.

**What to Do Instead**
- Reach out to ALL schools on your list at the same time — every level, simultaneously
- Find out which ones engage back: respond to emails, show up at your courts, reach out to your club coach, come to camps, follow on social media
- Let the list rank itself organically based on mutual interest
- Once you have actual feedback, offers, or real conversations — THEN start processing which schools you prefer

The school ranked #25 that's going after your daughter hard will naturally rise above the school ranked #1 that never responds. You don't need to force a ranking. The process creates it for you.

**The Bottom Line**
Stay open. Stay curious. Research schools, visit campuses when you can, go to camps, send your schedule to coaches, and collect real information. When you have offers and genuine interest from multiple programs, ranking happens naturally. Until then, don't put yourself in a box.

=== EMAILING COACHES AFTER A TOURNAMENT — WHAT NOT TO SAY ===
Use this when families ask about what to write in post-tournament emails, how to talk about a loss or tough finish, or what phrasing to avoid when reaching out to coaches.

**The Phrase That Isn't Landing**
After big tournaments, Jason hears from college coaches about a flood of emails that go something like this: "Our team didn't finish the way we wanted, but I played well."

A college coach friend texted Jason after Triple Crown specifically about this — dozens of recruits were sending that exact message, and his take was direct: "I don't think this lands the way they think it does."

Here's why.

**Two Problems With That Phrasing**

1. **"We didn't finish the way we wanted"** — every team that doesn't win could say this. It's not specific. It doesn't tell a coach anything about what you were actually trying to accomplish, what you learned, or how you competed. It's filler.

2. **"But I played well"** — connected to a team loss, this can read as "I did great, but my team let me down." Is that what the athlete meant? Probably not. But perception matters, and college coaches will often read into what you're saying — usually in a negative direction. If you don't control the narrative, they'll create one for you.

**What College Coaches Actually Want to Read**
Coaches set goals and standards for their own programs constantly. They can relate to a team not hitting every benchmark — but they need you to be specific. Replace vague with intentional:

- What were your actual team goals going into the tournament?
- What did you accomplish? What fell short? Why?
- What did YOUR performance look like specifically — not just "I played well"?
- What intangibles did you bring? Leadership, energy, communication, competing hard in a tough moment?

"We set out to accomplish A, B, and C this weekend. We felt really good about A and B, but C is something we need to keep working on" — that's a coach's language. That's something they can actually respond to.

**The Bigger Point: Don't Be Passive**
Phrases like "we didn't finish the way we wanted" and "I played well" are passive. They don't differentiate you. Hundreds of athletes are sending the same email with the same phrases, and none of them are standing out. If you want to stand out, be specific. Be honest. Show a coach that you can articulate what you're working toward and what it actually looked like.

**The Click-Send Principle Still Applies**
Sending the email is still better than not sending it. The goal isn't to make athletes afraid to reach out — it's to make their outreach actually count. Don't let vague language undo the effort of showing up in a coach's inbox.

=== LIBERO SCHOLARSHIPS — WHAT TO REALISTICALLY EXPECT ===
Use this when families ask about libero scholarships, how many years of scholarship a libero can expect, what partial scholarships mean, or how D1 roster limits affect libero recruiting.

**Quick Disclaimer on the Current D1 Landscape**
The Division 1 volleyball landscape is in transition right now — schools opting into revenue share are operating under different roster and scholarship limits than those staying on the traditional 12 full scholarship model. Every school is handling this differently. The framework below covers the most common scenarios, but always clarify with individual programs what their specific situation looks like.

**The Four Types of Libero Scholarship Situations**

**4-Year Scholarship — Rare, but it happens**
A four-year scholarship for a libero is uncommon, especially right now when programs are frequently pulling liberos from the transfer portal instead of committing long-term to a high school recruit. If a school is offering four years, the expectation is almost certainly that they want the athlete to start as a freshman. That's a meaningful signal — and if the fit is right, it's a genuinely excellent opportunity. Don't take it automatically, but understand how rare it is.

**3-Year Scholarship — Where libero scholarships typically start**
This is the realistic starting point for most libero scholarship conversations. The reason it's three and not four: most programs already have a junior or senior starting libero. They're not looking to overlap scholarships with two liberos simultaneously. The typical plan is: walk on as a freshman, earn your role, and pick up scholarship as a sophomore. Three years of scholarship — sophomore, junior, senior — is a strong outcome for a libero recruit.

**2-Year Scholarship — Fairly normal**
In this scenario, a program isn't expecting the athlete to start until junior year. Walk on as a freshman and sophomore, earn the starting position, and be on scholarship junior and senior year. This is common at programs on a two-year libero cycle.

**1-Year Scholarship — Less common, but real**
Some programs scholarship whoever the starting senior libero is. In this case, an athlete would walk on all three underclassman years and be on scholarship only as a senior. A lot of variables have to line up for this to work out — it's not impossible, but it requires patience and trust in the process.

**What "50% Scholarship" Usually Means**
When a coach mentions 50% scholarship, they're almost always talking about two years fully covered — typically junior and senior year — not a half-scholarship spread across four years. Partial scholarships do exist, especially at equivalency schools and in revenue-share programs, but don't assume that's what they mean without asking for clarification.

**Variables Outside Your Control**
- **Scholarships don't grow on trees.** Once a program hits its scholarship limit (12 for traditional D1 head-counter schools), that's it. If there's no scholarship available, the math doesn't change for your situation.
- **Roster limits are real.** Some programs are capping rosters at 16 or 18 athletes regardless of scholarship status. If there's no roster spot, there's no spot — walk-on or otherwise.
- **They may not be recruiting a libero in your class.** If a program just signed a libero in the 2026 class on three years of scholarship, they likely aren't looking for another libero until that cycle clears. This is completely out of your control.
- **Programs rarely overlap libero scholarships.** Two liberos on scholarship at the same time is uncommon. This is a big reason why four-year offers are rare and why the realistic cycle is two to three years.

**The Bottom Line for Libero Families**
A three-year scholarship is a strong outcome. A two-year scholarship is normal. A one-year scholarship can still be the right fit depending on the program and the opportunity. Understand what the program's libero cycle looks like, ask directly about roster plans, and don't assume a scholarship offer that sounds smaller than expected is a bad deal — context matters enormously.

=== PREPARING FOR A QUALIFIER — 3 THINGS TO DO THE WEEK BEFORE ===
Use this when athletes or families ask about how to prepare for an upcoming qualifier, what to do the week before a tournament, how to get mentally ready, or how to show up as a good teammate.

**The Non-Recruiting Prep That Actually Matters**
Yes, you should be emailing coaches and sending film before a qualifier. But there are three other things athletes can do the week before any qualifier that directly affect how they perform — and how they come across to the college coaches watching.

**1. Plan Your Week — Sleep and Food**
Don't just focus on the night before the tournament. Your body needs more runway than that.

Sleep: Can you go to bed a little earlier this week? Let your body bank extra rest before two and a half days of physical exhaustion at a convention center. One good night's sleep before day one isn't enough.

Food: Convention center food and tournament-weekend restaurants aren't always great. What can you eat THIS week to fuel your body heading in? A home-cooked meal mid-week beats fast food every time when you're prepping for a big weekend. Plan ahead. It's one week — it's worth being intentional about it.

**2. Set Goals You Actually Control**
Wanting to win is a great goal. But volleyball is a chaotic sport with lots of variables outside your control. Set some additional goals that are entirely yours to own — point to point, set to set, match to match.

A simple example: coming out of every timeout — whether your coach called it or theirs — you're going to high-five every single teammate. That's fully controllable. That's a goal you can hold yourself accountable to all weekend.

What are the things YOU can control? Show up to a timeout with energy. Chase every ball. Call every free ball early. Be the loudest voice of encouragement between points. These are the goals that, at the end of the weekend, you can honestly say "I did that" — regardless of the scoreboard. And those are also exactly the things college coaches notice when they're watching.

**3. Encourage Your Teammates**
Before the weekend even starts, how can you lift the people around you?

Send a text to a teammate after practice. Fire up the team group chat. Tell someone specifically what you noticed them doing well. The most successful teams at every level — club, high school, college — are aligned on what they're trying to accomplish and genuinely excited to compete together. You have the ability to contribute to that culture right now, this week, before you even step on the court.

Bringing your teammates with you mentally into the weekend is part of your job as a competitor.

**Why This Matters for Recruiting**
College coaches coming to watch you aren't just clocking your skills. They're watching how you interact with your team, how you compete in adversity, what your body language looks like when things go sideways, and whether you're someone they'd want in their program. Showing up physically prepared, mentally locked in, and as a genuine teammate — that's the full picture they're evaluating.

=== SHOULD YOU TELL EVERY COACH THEY'RE YOUR NUMBER ONE SCHOOL? ===
Use this when families ask about how to respond to coaches showing interest, whether to tell a school they're the top choice, how to handle programs the athlete isn't sure about, or advice they've heard from other parents about the recruiting process.

**The Question That Comes Up Constantly**
A parent heard from another parent that their daughter should tell every college coach she talks to that their school is her number one choice. Is that good advice?

No. And here's why.

**A Note on Recruiting Advice From Other Parents**
This isn't a knock on other parents — most are well-intentioned. But parents giving recruiting advice are almost always drawing from one experience: their own kid's process. That's a sample size of one. Recruiting coordinators who work with hundreds of athletes and coaches every year have a fundamentally different perspective. When you hear advice from another parent, take it with that context in mind.

**Why You Shouldn't Tell Everyone They're Your Number One**

First: it gets around. The volleyball community is small and interconnected. If an athlete tells three schools she's "most interested" in them, coaches talk. They compare notes. When they find out she's telling everyone the same thing, credibility is gone — and so is their interest. Being caught in that situation damages the relationship more than staying quiet ever would.

Second: it's the golden rule. How would an athlete feel if a coach told her she was their #1 recruit, then texted a week later saying they'd committed someone else? Coaches experience the same thing when athletes string them along. Treating coaches with the same respect you want from them isn't just good ethics — it's good recruiting strategy. Do things with integrity. If they don't reciprocate, that's on them.

Third: you don't actually know yet. Telling a school they're your number one before you've done your homework assumes you already know everything you need to know about fit. You probably don't.

**But Don't Say No to Everyone Either**
The opposite mistake is dismissing schools too early. An athlete who's only interested in Baylor but can't play at that level yet might be blowing off UT Dallas — which could be a genuinely great fit. Programs that don't hear back move on. They're not waiting around.

Jason sees this every year with families who visit University of Central Oklahoma: two weeks before the visit they're not that excited, and by the time they're on campus they're saying the facilities are great and the program is a real fit. You don't always know until you know.

**The Right Approach: Get on the Phone**
Instead of committing to "yes, you're my number one" or "no, I'm not interested" — get on a phone call. Talk to an assistant or head coach. Ask questions about the program, the roster, the academics, the culture. Maybe get on a Zoom with current players.

At minimum, one phone call gives you more information than you had before. At best, it opens a door you didn't expect. And even if the school still isn't the right fit, the practice of being on the phone with a college coach — knowing what to ask, how to respond when caught off guard, what questions land well — makes every future call better.

**The Bottom Line**
Don't tell every school they're your number one. Don't say no to every school you're unsure about. Find the middle ground: stay open, get on the phone, ask questions, and let real information — not assumptions — drive your list.

=== BEING PART OF A SUCCESSFUL PROGRAM VS. BEING THE REASON IT'S SUCCESSFUL ===
Use this when families ask about picking a "winning" program vs. a rebuilding one, whether to chase top-of-conference schools, the idea of a "D1 mentality," how much a school's current record should matter, or how to think about fit beyond wins and losses.

**The Core Idea**
A lot of athletes want to be part of a program that's already successful. Very few athletes actually want to be the reason a program becomes successful. Those are two different things, and it's worth being honest with yourself about which one you're chasing.

Wanting to win isn't a bad thing — it's actually a quality college coaches look for. But there's a real difference between wanting to be along for the ride on a winning team and wanting to be one of the people who builds that winning team.

**A Real Story**
Jason worked with an athlete who could have played D1, but chose a D2 program instead — she liked the coach, the area, the school, and it was a good overall fit. As a freshman, she individually had a terrific season — should have been Freshman of the Year in her conference — but the team went 5-9 in conference, near the bottom.

After that season, her mom called Jason. He assumed she was calling about a transfer. She wasn't. The athlete didn't want to leave.

The next season, the coach brought in some transfer portal pieces and the roster around her got stronger. The team went from 5-9 to 13-1 — co-champions of the conference, a trip to the conference tournament final, and an NCAA tournament appearance. The athlete was later named an All-American. None of that happens if she transfers out after a rough freshman year record.

**The Coaching Side of This**
Jason has lived this from the other chair too. As a head coach taking over a program that was 12th out of 13th in the conference, his recruiting pitch wasn't "come join something already built." It was closer to: "We're headed somewhere specific — conference contention, NCAA tournament — and the train is leaving. You can get on board and help us get there, or you can go somewhere else. That's fine too. But this is the direction we're going." Athletes looking to coast, or looking for everything to already be figured out for them, weren't the right fit for that. It takes real work to build a program, not just show up to one.

**The Emails That Only Show Up When You're Struggling**
Jason also shares a pointed observation from his coaching days: he'd get emails from people who'd never once been in the gym, never seen an athlete play, never been to a practice or a game — claiming a recruit would "really help the program improve." Those emails came in bunches while the program was struggling. Once the team started finishing near the top of the conference, those same emails stopped. The message: if someone (or some program) can't help you when things are hard, they're probably not going to be much help once things are good either.

**The Bottom Line**
Every athlete is different, and there's no wrong answer here — some genuinely would rather sit on the bench for a great program, and that's a completely valid preference. But it's worth being honest about which one you actually are: someone who wants to join something already built, or someone who wants to help build it. That distinction should factor into how you evaluate program fit — not just conference standings or name recognition.

=== COLLEGE COACHES AREN'T RESPONDING TO YOUR EMAILS — WHY THAT'S OKAY ===
Use this when families ask how many emails to send, how often to email, how long to wait for a response, or why a coach hasn't written back.

**Most Emails Won't Get a Response, and That's Normal**
For most athletes, coaches will not respond to every email. Whether you hear back depends on your age, who you're emailing, the time of year, and how interested that coach is in you. Only a few select athletes get a reply to every message.

**A Real Example**
Jason recently got a reply from a college coach in the first week of August to an email he sent at the end of May. That's nine to ten weeks with no response. Is that normal? Sometimes, yes. Jason has coaching friends he's known for over 10 years who still need two texts, a voicemail, and an email before he hears back. Coaches often return calls on their 15-minute drive home from the gym because that's the time they have.

**How Often to Email**
- Juniors and seniors trying to get recruited: emailing or texting every week is a great idea.
- Freshmen and sophomores just starting out, especially during high school and college season: once a month is fine.
- Either way, don't expect a response every time.

**They're Probably Still Seeing It**
Even without a reply, coaches are likely opening your email, clicking your film, and looking you up on University Athlete. How they respond depends on their level of interest in you.

**Consistency Communicates Interest**
How consistently you reach out tells coaches how interested you are. Coaches notice: "She's been emailing us a lot. We need to get back to her, or her club coach, or her recruiting coordinator, and let them know we're still interested, we're just busy." A response two months later is still useful information because it points you toward the schools that are mutually interested in you.

=== GETTING "GHOSTED" BY COLLEGE COACHES ===
Use this when a family says a coach ghosted them, stopped responding, or went quiet after showing interest.

**Jason's Honest (and Strong) Opinion**
Jason doesn't like using the word "ghosting" in recruiting. It always stinks to be ignored, and he doesn't think ignoring people is good. But "ghosting" implies you were owed a response, like a friend who should text you back. In recruiting, no one is guaranteed a response from anyone at any time. College coaches are not required to respond. Jason wishes they responded more and more consistently, but that's not how the process works.

**Why Coaches Go Quiet**
- In the fall especially, coaches are focused on the 16 or so players in their gym and everything it takes to run their season. Recruiting takes a back seat for many of them.
- People make mistakes. A coach starts a text, the phone rings, and by the time they come back the message is buried 25 texts deep. Coaches are responsible for 25 to 30 people between athletes, staff, trainers, and admin.
- It goes both ways: coaches tell Jason athletes "ghosted" them too, and his first question is always, "Did you reach out again?"

**What to Do Instead**
- Before deciding a coach is ignoring you, send a second and a third message. Text again, email again, then email again after that.
- Try different channels and different timing. Sometimes it's just about when your message lands.
- Ownership of communication falls on the athlete, not the coach. Coaches can always find the next athlete, and there are a lot of athletes and not a lot of roster spots.
- Recruiting is not a 273-day Snapchat streak. Keep pushing and stay determined. Don't fall back on "this school ghosted me."

=== BIGGEST RECRUITING MISTAKES (JASON, TAYLOR & MICHELLE) ===
Use this when families ask what mistakes to avoid, why they're not getting recruited, what they should be doing differently, or how to stay on coaches' radar. These come from working with athletes now AND from Taylor's and Jason's time as college coaches.

**Mistake 1: Not Staying on Coaches' Radar (Taylor)**
- Respond to every email from a coach, even the generic ones. A simple "Thank you," "Good luck in your match tonight," "Here's my schedule," or "Here's my Hudl link" shows you're reading and engaged. Many D2 and D3 programs send canned emails and then recruit the athletes who respond.
- Respond to coach texts right away, especially requests for film or visit schedules.
- Don't let your last email be from after Nationals. Coaches won't remember a name from four months ago.
- Fall is not a dead period for outreach. After a high school match, grab 30 seconds of clips and send it. That's a reason to reach out.
- Other reasons to reach out: new film, congrats on a big win, good luck in a big match, even a fun personal update like getting your driver's license.
- When an athlete emails consistently, coaches know exactly who she is by first name. If it comes down to her and someone they haven't heard from since February, she's already ahead.
- Liking, commenting on, and reposting a program's posts is a nice extra form of engagement, but it is NOT a replacement for email.

**Mistake 2: Not Using the People Who Can Help You (Jason)**
- Whoever your helper is (Jason, your club's recruiting coordinator, club director, club coach, high school coach), lean on them as much as possible. They can only help as much as they know.
- Forward every email you get from a college coach to that person. Even generic ones are useful information.
- Ask questions in the moment. Jason once got a question from a family about a situation that happened two months earlier. In the moment, it could have been fixed in 30 minutes with a text or call to the coach. Two months later, the window had passed. In the thick of club season (January through March), waiting even three weeks can be too long.
- Don't hold back because "we know you're busy." Reach out anyway.
- Example: a senior had a list of 8 to 10 schools to email for weeks and hadn't done it. When she finally sent the emails, she set up two phone calls within a couple of days. Even when things feel slow, being proactive creates engagement.

**Mistake 3: Thinking College Coaches Will Find You (Michelle)**
- This may be the biggest underlying issue in recruiting. Look around a convention center at a qualifier: there are far too many athletes for coaches to just find you.
- Maybe 1% of athletes (think 6'5" and touching 11 feet) get found without reaching out. Everyone else needs to email so coaches know they exist, have their schedule, and have them flagged in the app when walking the convention center.
- Jason's recruiting pyramid: at the top are athletes who help win national championships (about 10 schools have access to them). Below that, athletes who help win a Power Four conference, then athletes who help a program climb its conference, and so on. The further down the pyramid, the more athletes there are to choose from, so the more outreach and effort matter.
- Your effort has to match your goals. A senior doing nothing to get recruited who wants to sign in November doesn't have goals and a process that line up. Halfway effort gets halfway results, just like working on your vertical or your arm swing.
- Practical swap: spend 15 fewer minutes on TikTok after a match and use it to clip film or send emails.

**Bonus Mistake: Ruling Out Schools You've Never Heard Of (Taylor)**
- Don't cross a school off just because it isn't a "cool sweatshirt" school or you've never heard of it, especially if they're telling you they need your position and like your film. That's a great place to start.
- Take the phone call. Spend 10 minutes researching the school, look at pictures, visit if you can. Worst case, it's good phone call practice and you learn questions to ask the next coach.
- Taylor almost dismissed Marist (in New York) because no one would recognize the shirt. She visited, loved it, committed, and calls it the best four years of her life.
- Jason once had the worst first phone call of his coaching career with a recruit. She later came on a visit under protest (her dad made her get in the car), loved it, committed, and finished as a top 10 all-time kills leader for the school.

=== "UNDERSIZED" IS A MYTH — REAL HEIGHT DATA AT THE POWER FOUR LEVEL ===
Use this when families ask how tall you need to be to play at a certain level, whether their daughter is "too short" or "undersized," or average heights by position.

**Where the Data Comes From**
Jason pulled 2026 roster data for the Power Four conferences (SEC, ACC, Big Ten, Big 12) from online rosters. A small amount of data was missing, so treat these as close estimates, not exact figures.

**Average Height by Position (2026 Power Four rosters)**
- Outside hitters: average 6'1". Out of 312 outsides, 183 are BELOW the average and 129 are above.
- Setters: average just over 5'11". Out of 162 setters, 93 are below and 69 are above.
- Middle blockers: average about 6'2.5". Close to an even split: 134 above, 123 below.
- Liberos/DS: average just under 5'7". 125 are above and 100 are below, which fits what coaches tell Jason: they are looking for taller liberos, and that trend keeps growing.
- Right sides/opposites: average about 6'2". Out of 72, 44 are below and 28 are above.

**What This Means**
- For outsides, setters, and right sides, MORE Power Four players are below the average than above it. Jason once saw a school call a 6'1" outside hitter "undersized," which doesn't hold up when most outsides at that level are 6'1" or shorter.
- Averages don't tell the whole story. Plenty of athletes below the average are playing in the Power Four.
- Height is just one metric. Coaches look at how tall you are, how high you jump, how hard you hit, and how fast you are.
- Height doesn't neatly sort levels either. You'll still find 6'1" outsides at D2 and D3, 6'2" middles at D2, and some bigger pins and middles at mid-major D1 schools.
- Fitting a metric doesn't automatically make you a fit for a program, and every program is built differently. Recruiting is about fit.
- Never tell a family "you must be this tall to play at this level." Share the data and the bigger picture.

=== HOW MANY COLLEGE VOLLEYBALL SCHOLARSHIPS ARE ACTUALLY AVAILABLE? (D1 & D2) ===
Use this when families ask how many scholarships exist, their odds of getting a scholarship, full vs. partial scholarships, or how the five-year eligibility model affects scholarships. Give these as Jason's rough estimates, not exact counts.

**Start Here: Not Everyone Is on Scholarship**
Only D1 and D2 offer athletic scholarships in the NCAA. Roughly 20 to 30% of D1 and D2 roster spots across the country are walk-ons (not on athletic scholarship). Some fully funded D1 programs have every athlete on a full ride, but many don't.

**Division I**
- D1 programs have anywhere from 12 to 18 scholarships. Not every school is fully funded at 18. Most have 12 or a little more, and some high-academic schools have fewer. Ivy League schools offer no athletic scholarships.
- Using 12 as a fair, slightly conservative number: 12 x about 330 D1 schools = roughly 4,000 (maybe 4,500) D1 scholarships total.
- That used to be about 1,000 per recruiting class. With the move to a five-year eligibility model, those scholarships are spread across five classes, so it's now roughly 800 per class.
- Each class also has another 200 to 300 or so D1 walk-ons.

**Division II**
- D2 programs max out at 8 scholarships. Some have as few as 3, and some have more than certain D1 programs. Most land around 6 or 7.
- Using 8 as a high estimate: 8 x about 300 D2 schools = about 2,400, or roughly 600 per class. Under the five-year model, that drops to fewer than 500 per class.
- D2 scholarships are very often split into partials (half, quarter, or even something like $500 a semester for books), so they're spread across many more athletes.
- Because D2 has fewer scholarships, coaches typically stack athletic aid on top of the academic aid the school already offers to build the best total package. D1 schools do this too.

**The Big Picture**
- Combined, there are roughly 1,500 to 1,750 D1 and D2 scholarships per recruiting class across the entire country, and many of those are split between multiple athletes.
- The number of athletes playing D1 vs. D2 isn't hugely different.
- The five-year model means fewer scholarships per class and fewer college athletes overall.
- D3 does not offer athletic scholarships (merit and academic aid only). NAIA and junior college are separate options with their own rules.
- Never quote specific dollar amounts a family should expect. For their daughter's situation, point them to a call with Jason.

=== IS VOLLEYBALL BECOMING A GIMMICK? (STADIUM EVENTS & THE GROWTH OF THE SPORT) ===
Use this when someone asks about big stadium volleyball events, whether college volleyball is growing, how popular the sport is, or whether the hype is real. This is a lighter, sport-culture topic. Keep it conversational and only connect it to recruiting if the user does.

**The Events**
- 2023: Nebraska drew 92,000 fans to Memorial Stadium for a volleyball match in a football stadium. It's still the world record attendance for a women's sporting event.
- Late August 2026: Spikes Under the Lights at AT&T Stadium, with Nebraska, Florida, Penn State, and SMU competing for a $1 million prize.
- September 2026: 43,000 fans watched volleyball at Wrigley Field, the second-largest crowd in the ballpark's 100+ year history. The Nebraska vs. Missouri match was suspended because of moisture on the court, and fans stuck around anyway.

**Jason's Take: Not a Gimmick**
- A gimmick is a novelty that doesn't reflect the real product. The real test isn't whether people show up to something unusual. It's whether the turnout predicts anything when the stadium and cameras aren't there.
- The evidence says it does: Nebraska has sold out its home arena for years, GCU (a mid-major D1 program) packed its gym with about 7,000 fans for a regular home opener and set a program record, and high schools (especially in Texas) are moving matches into football stadiums.
- People don't sit through a rain delay, towel runs, and leaf blowers for a gimmick.
- These spectacle events are the front door. They're a funnel that gets casual fans curious enough to go watch their local high school or college match.
- The sport should keep doing big events, and learn from things like weather.

**What Volleyball Still Needs**
Coverage of the whole sport, not just the big spectacle events. The packed gym at a mid-major and other everyday stories deserve attention too. Jason compares it to the Olympics, where people watch a 15-minute athlete story before a 45-second race: the stories are what build a sport.
